apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    environment: dev
---
apiVersion: v1
kind: Service
metadata:
  name: recommender
  namespace: dev
  labels:
    app: recommender
    environment: dev
spec:
  type: ClusterIP
  selector:
    app: recommender
    environment: dev
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommender
  namespace: dev
  labels:
    app: recommender
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommender
      environment: dev
  template:
    metadata:
      labels:
        app: recommender
        environment: dev
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: docker-hub-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: recommender
          image: docker.io/anikolaevdo/recommender:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADDR
              value: ":8080"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: recommender-dev-env
                  key: REDIS_URL
            - name: USERS_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: recommender-dev-env
                  key: USERS_SERVICE_URL
            - name: ANALYTICS_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: recommender-dev-env
                  key: ANALYTICS_SERVICE_URL
            - name: LLM_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: recommender-dev-env
                  key: LLM_ENDPOINT
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recommender-dev-env
                  key: OPENROUTER_API_KEY
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
