name: Build, Push, and Deploy Docker Image

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/recommender
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
      MANIFEST_PATH: k8s/manifest.yaml
      KUBECONFIG: /tmp/kubeconfig

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Prepare kubeconfig
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl --kubeconfig "$KUBECONFIG" auth can-i get pods --all-namespaces

      - name: Create or update recommender environment Secret
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          USERS_SERVICE_URL: ${{ vars.USERS_SERVICE_URL }}
          ANALYTICS_SERVICE_URL: ${{ vars.ANALYTICS_SERVICE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret generic recommender-env \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=USERS_SERVICE_URL="$USERS_SERVICE_URL" \
            --from-literal=ANALYTICS_SERVICE_URL="$ANALYTICS_SERVICE_URL" \
            --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Apply Manifest
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f "$MANIFEST_PATH"

      - name: Set Docker image
        run: kubectl --kubeconfig "$KUBECONFIG" set image deployment/recommender recommender="docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/recommender:latest"

      - name: Restart Deployment
        run: kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment/recommender
